<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>pa_roda</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="roda" class="oculto">
        <div id="anel">
            <div id="abas">
                <span data-aba="armas" class="ativa">Armas</span>
                <span data-aba="itens">Itens</span>
                <span data-aba="bolso">Bolso</span>
            </div>
            <div id="ponteiro"><i></i></div>
            <div id="centro">
                <div id="c-nome"></div>
                <div id="c-sub"></div>
                <div id="c-municao"></div>
                <div id="c-extra"></div>
            </div>
            <div id="espacos"></div>
            <div id="bolso" class="oculto"></div>
        </div>
        <div id="rodape">
            <div id="dinheiro"><span>Dinheiro <b id="d-mao"></b></span><span class="sujo">Sujo <b id="d-sujo"></b></span></div>
            <button id="b-mochila">Abrir mochila <kbd>I</kbd></button>
        </div>
        <div id="dica"></div>
    </div>
    <script src="app.js"></script>
</body>
</html>
